name: Install & Test
'on':
    push:
        branches:
            - main
        paths-ignore:
            - README.md
    pull_request:
        paths-ignore:
            - README.md
jobs:
    sylius:
        name: 'PHP ${{ matrix.php }} Sylius ${{ matrix.sylius }} Symfony ${{ matrix.symfony }}'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - 8.2
                    - 8.3
                    - 8.4
                sylius:
                    - 2.1.0
                    - 2.2.0
                    - 2.3.0
                symfony:
                    - 6.4
                    - 7.4
                    - 8.1
                node:
                    - 22.x
                exclude:
                    # Symfony 8 requires PHP 8.4 and Sylius 2.3
                    -
                        php: 8.2
                        symfony: 8.1
                    -
                        php: 8.3
                        symfony: 8.1
                    -
                        sylius: 2.1.0
                        symfony: 8.1
                    -
                        sylius: 2.2.0
                        symfony: 8.1
                    # Sylius 2.2+ (and sylius/test-application 2.2+) requires PHP 8.3
                    -
                        php: 8.2
                        sylius: 2.2.0
                    -
                        php: 8.2
                        sylius: 2.3.0
                    # Sylius 2.3 (and sylius/test-application 2.3) requires Symfony 7.4+
                    -
                        sylius: 2.3.0
                        symfony: 6.4
                    # Sylius 2.1 is not tested on PHP 8.4
                    -
                        php: 8.4
                        sylius: 2.1.0
        env:
            APP_ENV: test
            package-name: synolia/sylius-gdpr-plugin
        steps:
            -
                name: 'Setup PHP'
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '${{ matrix.php }}'
                    ini-values: date.timezone=UTC
                    extensions: intl
                    tools: symfony
                    coverage: none
            -
                name: 'Setup Node'
                uses: actions/setup-node@v7
                with:
                    node-version: '${{ matrix.node }}'
            -
                uses: actions/checkout@v7
            -
                name: 'Composer - Get Cache Directory'
                id: composer-cache
                run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'
            -
                name: 'Composer - Set cache'
                uses: actions/cache@v6
                id: cache-composer
                with:
                    path: '${{ steps.composer-cache.outputs.dir }}'
                    key: 'php-${{ matrix.php }}-sylius-${{ matrix.sylius }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles(''**/composer.json'') }}'
                    restore-keys: 'php-${{ matrix.php }}-sylius-${{ matrix.sylius }}-symfony-${{ matrix.symfony }}-composer-'
            -
                name: 'Composer - Create cache directory'
                run: 'mkdir -p /home/runner/.composer/cache'
                if: 'steps.cache-composer.outputs.cache-hit != ''true'''
            -
                name: 'Composer - Github Auth'
                run: 'composer config -g github-oauth.github.com ${{ github.token }}'
            -
                name: 'Yarn - Get cache directory'
                id: yarn-cache
                run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'
            -
                name: 'Yarn - Set Cache'
                uses: actions/cache@v6
                with:
                    path: '${{ steps.yarn-cache.outputs.dir }}'
                    key: 'node-${{ matrix.node }}-yarn-${{ hashFiles(''**/package.json **/yarn.lock'') }}'
                    restore-keys: "node-${{ matrix.node }}-yarn-\n"
            -
                name: 'Composer - Install Symfony Flex globally'
                run: 'composer global config --no-plugins allow-plugins.symfony/flex true && composer global require --no-progress --no-scripts --no-plugins symfony/flex'
            -
                name: 'Install plugin with Sylius Test Application'
                run: 'make install -e SYLIUS_VERSION=${{ matrix.sylius }} SYMFONY_VERSION=${{ matrix.symfony }}'
            -
                name: 'Doctrine Schema Validate - Run'
                run: 'vendor/bin/console doctrine:schema:validate --skip-sync'
            -
                name: 'Lint container'
                run: 'vendor/bin/console lint:container'
            -
                name: 'Run PHPUnit'
                run: 'make phpunit'
        services:
            mariadb:
                image: 'mariadb:10.4.11'
                ports:
                    - '3306:3306'
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: true
                options: '--health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3'
